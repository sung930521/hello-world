<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>AI Camera Scanner View</title>
  <meta name="theme-color" content="#0ff06d"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <link rel="apple-touch-icon" href="images/create-octocat.png"/>
  <link rel="manifest" href="manifest.json"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0ff06d",
            "background-light": "#f5f8f7",
            "background-dark": "#102218",
          },
          fontFamily: {
            "display": ["Manrope"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
  <style>
    body {
      min-height: max(884px, 100dvh);
      font-family: 'Manrope', sans-serif;
    }
    .camera-overlay {
      background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.4) 100%);
    }
    .scanner-frame {
      border: 2px solid white;
      box-shadow: 0 0 15px rgba(15, 240, 109, 0.5);
    }
    .scanner-line {
      height: 2px;
      background: linear-gradient(90deg, transparent, #0ff06d, transparent);
      position: absolute;
      width: 100%;
      top: 50%;
      animation: scan 3s ease-in-out infinite;
    }
    @keyframes scan {
      0%, 100% { top: 0%; }
      50% { top: 100%; }
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display overflow-hidden">
  <div class="relative flex h-screen w-full flex-col overflow-hidden bg-black">
    <div class="absolute inset-0 z-0">
      <img class="h-full w-full object-cover opacity-80" data-alt="Grocery store shelf with various food products" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjqo0ileRr7N2l__J3ucym1BBN1bWRS53IpuWVxcpVKrT-DA87lWmeA18GzwDR5zZLqZMs4aUaJzAlYSI053nCYRgSyntU2Sk4n0VbfiTyXowmD9OoBDTMa4UqeRKOSqxBi6j0S3rBEayc7pquC4j1CHqPYL18oWTE3cGgwOEn7YXSAMTDF7GA6Drjs7rtXxHD9HrF-zS8fULBsQmI5vP__4MkVtJ-LMs_utGfXmsptDMSJiNnBBe_3SEsz5URoNW9H9z5bed-xck"/>
      <div class="absolute inset-0 camera-overlay"></div>
    </div>
    <div class="relative z-10 flex items-center justify-between px-6 pt-12">
      <button class="flex size-10 items-center justify-center rounded-full bg-black/40 text-white backdrop-blur-md">
        <span class="material-symbols-outlined">flash_off</span>
      </button>
      <div class="flex items-center gap-2 rounded-full bg-black/40 p-1 backdrop-blur-md">
        <span class="px-3 py-1 text-xs font-bold text-primary uppercase tracking-wider">Live AI Analysis</span>
      </div>
      <a class="flex size-10 items-center justify-center rounded-full bg-black/40 text-white backdrop-blur-md" href="index.html" aria-label="Close scanner">
        <span class="material-symbols-outlined">close</span>
      </a>
    </div>
    <div class="relative z-10 mt-6 flex justify-center px-4">
      <div class="flex h-11 w-full max-w-[280px] items-center rounded-xl bg-black/30 p-1 backdrop-blur-lg border border-white/10">
        <label class="flex h-full flex-1 cursor-pointer items-center justify-center rounded-lg text-sm font-semibold transition-all has-[:checked]:bg-primary has-[:checked]:text-black text-white">
          <span>Food</span>
          <input checked class="hidden" name="mode" type="radio"/>
        </label>
        <label class="flex h-full flex-1 cursor-pointer items-center justify-center rounded-lg text-sm font-semibold transition-all has-[:checked]:bg-primary has-[:checked]:text-black text-white">
          <span>Cosmetic</span>
          <input class="hidden" name="mode" type="radio"/>
        </label>
      </div>
    </div>
    <div class="relative z-10 flex flex-1 flex-col items-center justify-center px-8">
      <div class="relative aspect-[3/4] w-full max-w-[320px] scanner-frame rounded-2xl overflow-hidden bg-white/5">
        <div class="absolute -left-1 -top-1 size-8 border-l-4 border-t-4 border-primary rounded-tl-xl"></div>
        <div class="absolute -right-1 -top-1 size-8 border-r-4 border-t-4 border-primary rounded-tr-xl"></div>
        <div class="absolute -left-1 -bottom-1 size-8 border-l-4 border-b-4 border-primary rounded-bl-xl"></div>
        <div class="absolute -right-1 -bottom-1 size-8 border-r-4 border-b-4 border-primary rounded-br-xl"></div>
        <div class="scanner-line shadow-[0_0_15px_#0ff06d]"></div>
        <div class="absolute inset-0 flex flex-col items-center justify-end pb-8">
          <div class="rounded-lg bg-black/60 px-4 py-2 text-center backdrop-blur-sm">
            <p class="text-xs font-medium text-white">Align ingredients within frame</p>
          </div>
        </div>
      </div>
      <div class="mt-6 flex items-center gap-2 rounded-full bg-white/10 px-4 py-2 backdrop-blur-md">
        <span class="size-2 animate-pulse rounded-full bg-primary"></span>
        <p class="text-sm font-medium text-white">Searching for ingredients...</p>
      </div>
    </div>
    <div class="relative z-10 mb-12 flex items-center justify-around px-8">
      <button id="scanner-gallery" class="flex flex-col items-center gap-1 group">
        <div class="flex size-12 items-center justify-center rounded-full bg-black/40 text-white backdrop-blur-md border border-white/20 transition-transform active:scale-95">
          <span class="material-symbols-outlined">image</span>
        </div>
        <span class="text-[10px] font-bold text-white uppercase tracking-tighter">Gallery</span>
      </button>
      <button id="scanner-capture" class="relative flex size-20 items-center justify-center rounded-full bg-white transition-transform active:scale-90">
        <div class="size-[72px] rounded-full border-4 border-black/5 flex items-center justify-center">
          <div class="size-14 rounded-full bg-primary flex items-center justify-center">
            <span class="material-symbols-outlined text-black text-3xl">barcode_scanner</span>
          </div>
        </div>
      </button>
      <a class="flex flex-col items-center gap-1 group" href="result.html">
        <div class="flex size-12 items-center justify-center rounded-full bg-black/40 text-white backdrop-blur-md border border-white/20 transition-transform active:scale-95">
          <span class="material-symbols-outlined">history</span>
        </div>
        <span class="text-[10px] font-bold text-white uppercase tracking-tighter">History</span>
      </a>
    </div>
    <div class="relative z-10 flex w-full border-t border-white/10 bg-black/40 px-6 pb-8 pt-2 backdrop-blur-xl">
      <a class="flex flex-1 flex-col items-center justify-center gap-1 text-white/40" href="index.html">
        <span class="material-symbols-outlined">home</span>
        <p class="text-[10px] font-semibold">Home</p>
      </a>
      <a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary" href="scanner.html">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">qr_code_scanner</span>
        <p class="text-[10px] font-semibold">Scan</p>
      </a>
      <a class="flex flex-1 flex-col items-center justify-center gap-1 text-white/40" href="dictionary.html">
        <span class="material-symbols-outlined">shield_with_heart</span>
        <p class="text-[10px] font-semibold">Safety</p>
      </a>
      <a class="flex flex-1 flex-col items-center justify-center gap-1 text-white/40" href="result.html">
        <span class="material-symbols-outlined">person</span>
        <p class="text-[10px] font-semibold">Profile</p>
      </a>
    </div>
    <div class="absolute bottom-1 left-1/2 z-20 h-1.5 w-32 -translate-x-1/2 rounded-full bg-white/20"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
