<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Ingredient Analysis Result</title>
  <meta name="theme-color" content="#0ff06d"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <link rel="apple-touch-icon" href="images/create-octocat.png"/>
  <link rel="manifest" href="manifest.json"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0ff06d",
            "background-light": "#f5f8f7",
            "background-dark": "#102218",
            "caution": "#facc15",
            "avoid": "#f87171",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      min-height: max(884px, 100dvh);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen pb-24">
  <div class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md px-4 py-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-800">
    <a class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" href="index.html">
      <span class="material-symbols-outlined">arrow_back_ios_new</span>
    </a>
    <h1 class="text-lg font-bold tracking-tight">Analysis Result</h1>
    <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
      <span class="material-symbols-outlined">ios_share</span>
    </button>
  </div>
  <main class="max-w-md mx-auto p-4 space-y-6">
    <div class="flex flex-col items-center justify-center py-6 text-center space-y-4">
      <div class="relative" id="result-badge"></div>
      <img id="result-image" class="hidden w-full max-w-[240px] rounded-2xl border border-slate-200 dark:border-slate-700" alt="Captured product"/>
      <div class="space-y-1">
        <h2 id="result-title" class="text-2xl font-extrabold text-slate-900 dark:text-white">Scan Result</h2>
        <p id="result-summary" class="text-slate-500 dark:text-slate-400 font-medium">Run a scan to see a summary.</p>
        <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-primary/10 text-primary-dark rounded-full text-xs font-bold uppercase tracking-wider mt-2">
          <span class="material-symbols-outlined text-sm">auto_awesome</span>
          AI Analysis Verified
        </div>
      </div>
    </div>
    <section class="space-y-4">
      <div class="flex items-center justify-between px-1">
        <h3 class="text-lg font-bold">Ingredient Analysis</h3>
        <span id="ingredient-count" class="text-sm font-medium text-primary">0 ingredients total</span>
      </div>
      <div id="result-ingredients" class="space-y-3"></div>
    </section>
    <section class="space-y-4 pt-4">
      <h3 class="text-lg font-bold px-1">Highly Recommended Alternatives</h3>
      <div id="result-alternatives" class="flex overflow-x-auto gap-4 pb-4 snap-x no-scrollbar"></div>
    </section>
    <section class="space-y-3">
      <h3 class="text-lg font-bold px-1">Scan History</h3>
      <div id="history-list" class="space-y-3"></div>
    </section>
  </main>
  <div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm border-t border-gray-200 dark:border-gray-800 max-w-md mx-auto z-50">
    <a class="w-full bg-primary hover:bg-opacity-90 text-slate-900 font-extrabold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-transform active:scale-95" href="scanner.html">
      <span class="material-symbols-outlined">camera_enhance</span>
      Scan Another Product
    </a>
  </div>
  <script src="app.js"></script>
</body>
</html>
